name: my_portfolio
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter_riverpod: ^2.6.1
  intl: ^0.18.1
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.9
  responsive_framework: ^1.5.1
  go_router: ^15.1.3
  google_fonts: ^6.3.3
  url_strategy: ^0.3.0
  font_awesome_flutter: ^11.0.0
  collection: ^1.19.1
  flutter_animate: ^4.5.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  visibility_detector: ^0.4.0+2

  flutter:
    sdk: flutter
  firebase_crashlytics: ^4.3.5
  firebase_analytics: ^11.4.5
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.6
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6
  build_runner: ^2.4.15
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5
  flutter_gen_runner: ^5.10.0 

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/skills/
    - assets/branding/
    - assets/projects/academic_calendar/
    - assets/projects/afaky/
    - assets/projects/allemny/
    - assets/projects/bank_aldam/
    - assets/projects/blue_house_dashboard/
    - assets/projects/blue_house_user/
    - assets/projects/boardverse/
    - assets/projects/brain_land/
    - assets/projects/crystal_crush/
    - assets/projects/dleel/
    - assets/projects/driving_school_dashboard/
    - assets/projects/gala_driver/
    - assets/projects/gala_order/
    - assets/projects/hayat_almuslim/
    - assets/projects/helpers/
    - assets/projects/hijri/
    - assets/projects/ksa_events/
    - assets/projects/mariam/
    - assets/projects/omni_labs/
    - assets/projects/prayer_times/
    - assets/projects/qr_scanner/
    - assets/projects/saudi_calendars/
    - assets/projects/smart_spend/
    - assets/projects/tabarak/
    - assets/projects/taskaty/
    - assets/projects/tejara/
    - assets/projects/vibezo/
    - assets/projects/wardi/
    - assets/projects/whatsapp_stories/

# flutter pub run flutter_native_splash:create
flutter_native_splash:
  color: "#ffffff"
  image: assets/images/logo.png
  color_dark: "#0F172A"
  image_dark: assets/images/logo.png

  android_12:
    image: assets/images/logo.png
    icon_background_color: "#ffffff"
    image_dark: assets/images/logo.png
    icon_background_color_dark: "#0F172A"

  web: true

# flutter pub run flutter_launcher_icons:main
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true

  image_path: "assets/images/logo.png"

  web:
    generate: true
    image_path: "assets/images/logo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/logo.png"